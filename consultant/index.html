<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS Consultant Drill Planner</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <a class="back-link" href="/">◀ Menu</a>
        <h1>Consultant Drill Planner</h1>
      </div>

      <div class="topbar-right">
        <label class="file-btn">
          Import CSV
          <input id="csvFileInput" type="file" accept=".csv,text/csv" hidden />
        </label>
        <button id="refreshBtn" class="icon-btn" type="button">↻</button>
      </div>
    </header>

    <main class="page">
      <section class="panel">
        <div class="panel-row">
          <div class="field">
            <label for="eventSelect">Event</label>
            <select id="eventSelect">
              <option value="">Loading events…</option>
            </select>
          </div>

          <div class="field field-toggle">
            <label>&nbsp;</label>
            <button id="filterStudentsBtn" class="chip-btn" type="button">Filter Students</button>
          </div>

          <div class="field field-toggle">
            <label>&nbsp;</label>
            <button id="togglePastEventsBtn" class="chip-btn" type="button">Show past events</button>
          </div>
        </div>

        <div id="statusArea" class="status-area"></div>
        <div id="csvInfo" class="csv-info"></div>
      </section>

      <section id="board" class="board"></section>
    </main>
  </div>

  <div id="studentFilterModal" class="modal hidden">
    <div class="modal-card filter-modal-card">
      <div class="modal-header">
        <h2>Filter Students</h2>
      </div>

      <div class="filter-actions">
        <button id="filterSelectAllBtn" class="chip-btn" type="button">Select All</button>
        <button id="filterClearAllBtn" class="chip-btn" type="button">Clear All</button>
      </div>

      <div id="studentFilterList" class="student-filter-list"></div>

      <div class="modal-footer">
        <button id="filterDoneBtn" class="primary-btn" type="button">Done</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Edit Ride</h2>
      </div>

      <p class="modal-hint">
        Choose an official drill below or type a custom entry like SSLA T1+T12.
      </p>

      <div class="modal-body">
        <div id="coachRecommendationBox" class="coach-rec-box hidden">
          <div class="coach-rec-title">Coach recommendation</div>
          <div id="coachRecommendationContent"></div>
          <div id="coachRecommendationConfidence" class="coach-rec-confidence hidden"></div>
          <div id="coachRecommendationConfidenceDetail" class="coach-rec-confidence-detail hidden"></div>
        </div>

        <div id="coachAudioBox" class="coach-audio-box hidden">
          <div class="coach-audio-title">Coach audio</div>
          <audio id="coachAudioPlayer" controls preload="none"></audio>
          <label class="inline-check hidden" id="coachVideoReviewedRow">
            <input id="coachVideoReviewed" type="checkbox" />
            <span>Coach video reviewed</span>
          </label>
        </div>

        <div id="consultantAudioBox" class="coach-audio-box hidden">
          <div class="coach-audio-title">Consultant audio for coach</div>
          <audio id="consultantAudioPlayer" controls preload="none"></audio>
        </div>

        <div class="consultant-audio-actions">
          <button id="consultantRecordBtn" class="chip-btn" type="button">Record</button>
          <button id="consultantStopBtn" class="chip-btn" type="button" disabled>Stop</button>
          <button id="consultantPlayBtn" class="chip-btn" type="button" disabled>Play</button>
          <button id="consultantUploadBtn" class="chip-btn" type="button" disabled>Upload</button>
          <label class="file-btn">
            Upload consultant audio
            <input id="consultantAudioUpload" type="file" accept="audio/*" hidden />
          </label>
        </div>

        <div id="consultantAudioPreviewBox" class="coach-audio-box hidden">
          <div class="coach-audio-title">Recorded preview</div>
          <audio id="consultantAudioPreviewPlayer" controls preload="none"></audio>
        </div>

        <label class="field">
          <span>Drill code or custom entry</span>
          <input id="editValue" type="text" placeholder="SSLA or custom drill…" />
        </label>

        <label class="field">
          <span>Turn(s)</span>
          <input id="editTurnText" type="text" placeholder="T10 or T3+T4" />
        </label>

        <div class="toggle-row">
          <button id="editIsVideoBtn" class="toggle-chip" type="button">Video</button>
          <button id="editIsBracketingBtn" class="toggle-chip" type="button">Bracketing</button>
        </div>

        <label class="field">
          <span>Search drills</span>
          <input id="drillSearch" type="text" placeholder="Search drills…" />
        </label>

        <label class="field">
          <span>Custom drill description for coach</span>
          <textarea id="editCustomDescription" rows="4" placeholder="Custom drill description for coach…"></textarea>
        </label>

        <div class="picker-header">
          <div id="drillCount">Drills: 0</div>
          <button id="clearTextBtn" class="chip-btn" type="button">Clear text</button>
        </div>

        <div id="drillList" class="drill-list"></div>
      </div>

      <div class="modal-footer">
        <button id="cancelBtn" class="secondary-btn" type="button">Cancel</button>
        <button id="saveBtn" class="primary-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
